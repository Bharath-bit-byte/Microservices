server:
  port: 8080 # The gateway will run on port 8080 (update if needed)

spring:
  application:
    name: API-GATEWAY
  cloud:
    gcp:
      project-id: total-name-504016-j2
    gateway:
      routes:
        # Route for Citizen Microservice
        - id: citizen-service
          # For local testing, use http://localhost:8001 (or 8081 based on your previous config)
          # For GCP, replace with the deployed Cloud Run URL (e.g., https://citizen-app-xyz.a.run.app)
          uri: http://localhost:8001 
          predicates:
            - Path=/citizen/**  # <-- FIXED: changed from /vaccinationCenter/**
            
        # Route for Vaccination Center Microservice
        - id: vaccination-center-service
          # For local testing, use http://localhost:8002
          # For GCP, replace with the deployed Cloud Run URL (e.g., https://vaccination-app-xyz.a.run.app)
          uri: http://localhost:8002 
          predicates:
            - Path=/vaccinationCenter/** # <-- FIXED: changed from /center/** to match your controller